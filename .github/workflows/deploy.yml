name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Setter nødvendige tilganger for GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Installer avhengigheter
        run: npm ci

      - name: Bygg med VitePress
        run: npm run build

      - name: Last opp artefakt
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Distribuer til GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
